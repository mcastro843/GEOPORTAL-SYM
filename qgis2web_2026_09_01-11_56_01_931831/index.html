        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

<script>
// Función para buscar al presionar la tecla 'Enter' en el teclado
function evaluarEnter(event) {
    if (event.key === "Enter") {
        buscarPorCUI();
    }
}

// Función principal de búsqueda de CUI
function buscarPorCUI() {
    // 1. Obtener el texto ingresado y limpiar espacios extra
    var cuiBuscado = document.getElementById('cui-input').value.trim();

    if (cuiBuscado === "") {
        alert("Por favor, ingrese un número de CUI para buscar.");
        return;
    }

    var encontrado = false;

    // 2. Identificar la capa vectorial de puntos
    // NOTA: 'layer_Inversiones_1' es el nombre genérico asignado por qgis2web.
    // Si en tu código la capa tiene otro nombre (ej. json_Inversiones_1 o layer_inversiones), cámbialo aquí.
    var capaInversiones = layer_ESTADO_5; 

    // 3. Recorrer cada punto en la capa
    capaInversiones.eachLayer(function(layer) {
        if (layer.feature && layer.feature.properties) {
            
            // Reemplaza 'CUI' con el nombre EXACTO de la columna de tu capa en QGIS
            var valorCUI = layer.feature.properties['CUI'];

            // Comparar convirtiendo ambos valores a texto
            if (valorCUI && valorCUI.toString().trim() === cuiBuscado) {
                encontrado = true;

                // A) Centrar el mapa en las coordenadas del proyecto y hacer zoom
                map.setView(layer.getLatLng(), 15);

                // B) Abrir la ventana emergente (popup) con el detalle
                layer.openPopup();
            }
        }
    });

    // 4. Notificación en caso de no hallar registros
    if (!encontrado) {
        alert("No se encontró ninguna inversión registrada con el CUI: " + cuiBuscado);
    }
}
</script>
